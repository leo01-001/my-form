<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聯絡表單</title>
</head>
<body style="font-family: Arial; padding: 20px;">
    <h2>我的第一個 GitHub Pages 表單</h2>
    <form action="https://collage-replay-backlash.ngrok-free.dev/mautic/index.php/form/submit?formID=3" method="POST">

        <label>姓名：</label><br>
        <input type="text" name="name" required><br><br>
        
        <label>電子信箱：</label><br>
        <input type="email" name="email" required><br><br>
        
        <label>訊息：</label><br>
        <textarea name="message" rows="4" required></textarea><br><br>
        
        <button type="submit">提交表單</button>
    </form>
</body>
</html>
