<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Mautic 表單測試</title>
</head>
<body>

    <h1>使用者資訊收集</h1>
    
    <!-- 確保 action 網址與您的表單 ID 一致 -->
    <form action="http://localhost:8080/form/submit?id=3" method="post">
        
        <!-- 只需要這一個隱藏欄位即可 -->
        <input type="hidden" name="mauticform[formid]" value="3">

        <p>
            <label>姓名：</label>
            <!-- 確保使用您後台看到的 f_name -->
            <input type="text" name="mauticform[name]" required>
        </p>

        <p>
            <label>電子郵件：</label>
            <input type="email" name="mauticform[email]" required>
        </p>

        <p>
            <button type="submit">確認送出</button>
        </p>
        
    </form>

</body>
</html>
