<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聯絡表單</title>
</head>
<body style="font-family: Arial; padding: 20px;">

    <h2>聯絡表單</h2>

    <!-- 使用 JavaScript 處理提交，不會觸發網頁跳轉 -->
    <form onsubmit="sendToMautic(event)">
        
        <!-- 姓名輸入框 -->
        <label>姓名：</label><br>
        <input type="text" id="username" required><br><br>

        <!-- 電子信箱輸入框 -->
        <label>電子信箱：</label><br>
        <input type="email" id="useremail" required><br><br>

        <!-- 提交按鈕 -->
        <button type="submit">提交表單</button>
        
    </form>

    <script>
    function sendToMautic(event) {
        event.preventDefault(); // 阻止網頁跳轉

        // 1. 抓取欄位實際輸入的值
        var nameValue = document.getElementById('username').value;
        var emailValue = document.getElementById('useremail').value;

        // 2. 還原為最安全的 FormData 格式
        var formData = new FormData();
        formData.append('mauticform[formId]', '3');
        formData.append('mauticform[formName]', 'userinfocollection');
        
        // 【核心修改】加入段落欄位（Paragraph）在 Mautic 中所有可能的後台代碼
        formData.append('mauticform[name]', nameValue);
        formData.append('mauticform[firstname]', nameValue);
        formData.append('mauticform[first_name]', nameValue);
        formData.append('mauticform[paragraph]', nameValue);   // 可能性極高 1
        formData.append('mauticform[paragraph1]', nameValue);  // 可能性極高 2
        formData.append('mauticform[textarea]', nameValue);    // 可能性極高 3
        
        // 信箱欄位（維持不變）
        formData.append('mauticform[email]', emailValue);
        formData.append('mauticform[Email]', emailValue); 

        // 3. 在背景將資料發送到您本機的 Mautic 系統
        fetch('http://localhost:8080/form/submit?formId=3', {
            method: 'POST',
            body: formData,
            mode: 'no-cors'
        })
        .then(function() {
            alert("資料已嘗試發送！請刷新 Mautic 後台檢查名字有沒有出來。");
            document.getElementById('username').value = '';
            document.getElementById('useremail').value = '';
        })
        .catch(function(error) {
            alert("發送失敗，請確認您的 Mautic 是否正常開啟。");
        });
    }
</script>



</body>
</html>
