<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GitHub 跨域表單測試</title>
    
    <!-- 核心關鍵：必須在 Head 引入 Mautic 的全域追蹤腳本，建立本地端 Session 信任 -->
    <script type="text/javascript">
        (function(w,d,t,u,n,a,m){w['MauticTrackingObject']=n;
            w[n]=w[n]||function(){(w[n].q=w[n].q||[]).push(arguments)},a=d.createElement(t),
            m=d.getElementsByTagName(t)[0];a.async=1;a.src=u;m.parentNode.insertBefore(a,m)
        })(window,document,'script','http://localhost:8080/mtc.js','mt');
        mt('send', 'pageview');
    </script>
</head>
<body>

    <h1>外部表單資料提交</h1>
    
    <!-- 標準跨域 POST 路由 -->
    <form action="http://localhost:8080/form/submit?id=3" method="post">
        
        <!-- 表單 ID -->
        <input type="hidden" name="mauticform[formid]" value="3">

        <p>
            <label>姓名：</label>
            <!-- 確保對應您後台的 f_name -->
            <input type="text" name="mauticform[f_name]" required>
        </p>

        <p>
            <label>電子郵件：</label>
            <input type="email" name="mauticform[email]" required>
        </p>

        <p>
            <button type="submit">確認送出</button>
        </p>
        
    </form>

</body>
</html>
