<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聯絡表單</title>
</head>
<body style="font-family: Arial; padding: 20px;">

    <h2>聯絡表單</h2>

    <!-- 使用 JavaScript 處理提交，不會觸發網頁跳轉 -->
    <form onsubmit="sendToMautic(event)">
        
        <!-- 姓名輸入框 -->
        <label>姓名：</label><br>
        <input type="text" id="username" required><br><br>

        <!-- 電子信箱輸入框 -->
        <label>電子信箱：</label><br>
        <input type="email" id="useremail" required><br><br>

        <!-- 提交按鈕 -->
        <button type="submit">提交表單</button>
        
    </form>

    <script>
    function sendToMautic(event) {
        event.preventDefault(); // 阻止網頁跳轉

        // 1. 抓取欄位實際輸入的值
        var nameValue = document.getElementById('username').value;
        var emailValue = document.getElementById('useremail').value;

        // 2. 使用 URL 格式打包資料，這種格式對 Mautic 後台的相容性最高
        var details = {
            'mauticform[formId]': '3',
            'mauticform[formName]': 'userinfocollection',
            'mauticform[name]': nameValue,
            'mauticform[email]': emailValue,     // 嘗試全小寫
            'mauticform[Email]': emailValue      // 同時帶上大寫，雙重保險
        };

        var formBody = [];
        for (var property in details) {
            var encodedKey = encodeURIComponent(property);
            var encodedValue = encodeURIComponent(details[property]);
            formBody.push(encodedKey + "=" + encodedValue);
        }
        formBody = formBody.join("&");

        // 3. 在背景將資料發送到您本機的 Mautic 系統
        fetch('http://localhost:8080/form/submit?formId=3', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
            },
            body: formBody,
            mode: 'no-cors' // 允許跨網域發送
        })
        .then(function() {
            alert("資料已嘗試發送！請刷新 Mautic 後台查看新紀錄。");
            document.getElementById('username').value = '';
            document.getElementById('useremail').value = '';
        })
        .catch(function(error) {
            alert("發送失敗，請確認您的 Mautic 是否正常開啟。");
        });
    }
</script>

</body>
</html>
