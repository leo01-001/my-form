<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聯絡表單</title>
</head>
<body style="font-family: Arial; padding: 20px;">

    <h2>聯絡表單</h2>

    <!-- 普通的表單結構 -->
    <form action="#" method="POST">
        
        <!-- 姓名輸入框 -->
        <label>姓名：</label><br>
        <input type="text" name="username" required><br><br>

        <!-- 電子信箱輸入框 -->
        <label>電子信箱：</label><br>
        <input type="email" name="useremail" required><br><br>

        <!-- 提交按鈕 -->
        <button type="submit">提交表單</button>
        
    </form>

</body>
</html>
